name: Build and test

on:
  # A PR builds once (pull_request); main builds again after the merge, which publishes the APK.
  # Branch pushes without a PR do not build: start one with workflow_dispatch if needed.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # the cleanup step below deletes old artifacts

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the build number is the commit count
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests (golden comparisons against the Python originals, clients, strategies)
        run: ./gradlew --no-daemon :core:test
      - name: App tests (Room stores, vault, screens)
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Android lint (errors fail the build)
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Build release APK (R8, signed with the release key when the secrets are set)
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_B64" ]; then
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          fi
          ./gradlew --no-daemon :app:assembleRelease
      - uses: actions/upload-artifact@v4
        # A full artifact store (the private repo's quota) must not fail the build: the APK is also published as a release.
        continue-on-error: true
        with:
          name: marketbot-release-apk
          retention-days: 14
          path: app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        # A full artifact store (the private repo's quota) must not fail the build: the APK is also published as a release.
        continue-on-error: true
        with:
          # Without this, a crash from a release build cannot be read (R8 renames every class).
          name: marketbot-release-mapping
          retention-days: 30
          path: app/build/outputs/mapping/release/mapping.txt
      - uses: actions/upload-artifact@v4
        # A full artifact store (the private repo's quota) must not fail the build: the APK is also published as a release.
        continue-on-error: true
        with:
          name: marketbot-apk
          retention-days: 7
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        # A full artifact store (the private repo's quota) must not fail the build: the APK is also published as a release.
        continue-on-error: true
        if: always()
        with:
          name: screens-and-test-reports
          retention-days: 5
          path: |
            app/build/screens
            core/build/reports/tests
            app/build/reports/tests
      - name: Publish APK as a pre-release (default branch only)
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$((100 + $(git rev-list --count HEAD)))   # = versionCode, see app/build.gradle.kts
          cp app/build/outputs/apk/release/app-release.apk marketbot-$n.apk
          cp app/build/outputs/mapping/release/mapping.txt mapping-$n.txt
          gh release view "build-$n" >/dev/null 2>&1 && exit 0
          gh release create "build-$n" marketbot-$n.apk mapping-$n.txt \
            --prerelease --title "Marketbot build $n" \
            --notes "Build $n from ${{ github.sha }}. Install by opening the APK on your phone; the app also checks for this under Settings > About."
      - name: Keep only the two newest builds (default branch only)
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Releases: the newest two build-N pre-releases stay (this one and the one before); older ones and their tags go.
          gh release list --limit 500 --json tagName -q '.[].tagName' | grep -E '^build-[0-9]+$' | sort -t- -k2 -n -r | tail -n +3 \
            | while read -r t; do echo "deleting release $t"; gh release delete "$t" --yes --cleanup-tag || true; done
          # Actions artifacts count against the private repo's storage: keep only this run's.
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" -q ".artifacts[] | select(.workflow_run.id != ${{ github.run_id }}) | .id" \
            | while read -r id; do gh api -X DELETE "repos/$REPO/actions/artifacts/$id" >/dev/null || true; done
