name: Commodity order-book collector

# Kalshi serves 1-minute candles but NOT historical order books, so the lead
# question below 60 minutes ("does quoting closer to close pay more?") can only
# be answered on books recorded as they happen. research/commodity/DEPLOY.md
# assumed a machine that stays up; there wasn't one, so nothing was ever
# recorded. This is that machine.
#
# Commodity closes cluster twice a day -- 19:30Z (~30 markets) and 22:00Z (~270)
# -- and the collector tracks a market only inside 120 minutes of its close. One
# job starting at 17:25Z therefore covers BOTH clusters in ~4.9 h, inside the
# 6 h job limit, on a public repo where minutes are free.
#
# A missed day cannot be recovered. If a run fails, re-run it only while a
# window is still open; afterwards the books are gone.
on:
  # MANY SHORT FIRES, NOT ONE LONG ONE. The first design was a single daily
  # 17:25Z job of ~295 cycles, and on its first day it NEVER FIRED -- zero runs,
  # while a manual dispatch of the same file worked. GitHub's `schedule` is
  # explicitly best-effort ("can be delayed during periods of high load"), which
  # is an unfit host for a collector whose own documentation says a missed day
  # cannot be recovered: one dropped fire cost the whole day.
  #
  # Every 15 minutes from 17:00Z to 22:59Z instead, each run collecting ~14
  # minutes and exiting. That spans both close clusters (19:30Z and 22:00Z) with
  # the 120-minute tracking window ahead of each, and a dropped fire now costs
  # 15 minutes rather than a day.
  schedule:
    - cron: "*/15 17-22 * * *"
  workflow_dispatch:
    inputs:
      cycles:
        description: "Cycles to run (60 s each). 14 fills one 15-minute slot."
        default: "14"
      interval:
        description: "Seconds between cycles."
        default: "60"

permissions:
  contents: read

concurrency:
  # Never two collectors on one window: duplicate rows are harmless (the inserts
  # are idempotent) but duplicate jobs waste the window and confuse the cycle log.
  group: book-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # One 15-minute slot plus slack for a late start. Short runs are the point:
    # a dropped or delayed fire loses its own slice, not the day.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Record books for this slot
        run: |
          python3 research/commodity/book_collector.py \
            --cycles "${{ github.event.inputs.cycles || '14' }}" \
            --interval "${{ github.event.inputs.interval || '60' }}"

      # Always export: a run cancelled or timed out mid-window still holds real
      # books, and the runner's disk is about to be destroyed either way.
      - name: Export what was recorded
        if: always()
        run: |
          python3 research/commodity/book_collector.py --stats | tee -a "$GITHUB_STEP_SUMMARY"
          python3 research/commodity/book_collector.py --export exported

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commodity-books-${{ github.run_id }}
          path: exported/
          # ~24 small artifacts a day rather than one big one. The measurement
          # needs a week or two, so 30 days is ample and keeps the repo free of a
          # database that grows ~100 MB a month.
          retention-days: 30
          if-no-files-found: error
