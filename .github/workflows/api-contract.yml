name: Daily API wording check

# Checks once a day that Kalshi, Polymarket US and the BTC price venues still answer
# in the words the app relies on: field names, enum values, slug and ticker shapes,
# error wording, and Kalshi's published OpenAPI spec. A change opens an issue labelled
# api-contract (or comments on the open one); the issue closes itself once a run passes.
# Scheduled runs use the workflow file on the default branch.

on:
  schedule:
    - cron: "43 17 * * *"   # daily, 17:43 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "core/src/main/kotlin/com/marketbot/core/contract/**"
      - "core/src/test/kotlin/com/marketbot/core/contract/**"
      - ".github/workflows/api-contract.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: api-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the venues (read-only; the demo probes run only with a demo key)
        id: check
        continue-on-error: true
        env:
          # Optional: a key for Kalshi's DEMO exchange (mock money), used to provoke the two
          # refusals the app reads by their wording. Never a real-exchange key.
          KALSHI_DEMO_KEY_ID: ${{ secrets.KALSHI_DEMO_KEY_ID }}
          KALSHI_DEMO_PRIVATE_KEY: ${{ secrets.KALSHI_DEMO_PRIVATE_KEY }}
        run: ./gradlew --no-daemon :core:contractTest
      - name: Report
        if: always()
        run: |
          f=core/build/api-contract/report.md
          if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; else echo "No report: the check did not run (see the log)." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-contract-report
          path: |
            core/build/api-contract/report.md
            core/build/reports/tests/contractTest
      - name: Open, update or close the tracking issue
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          f=core/build/api-contract/report.md
          if [ -f "$f" ]; then status=$(head -1 "$f" | sed 's/STATUS: //'); else status=ERROR; fi
          gh label create api-contract --color B60205 --description "The daily API wording check found a change" --force >/dev/null
          open=$(gh issue list --label api-contract --state open --json number --jq '.[0].number // empty')
          body=$(mktemp)
          { echo "Run: $RUN_URL"; echo; [ -f "$f" ] && tail -n +3 "$f" || echo "The check did not produce a report; see the run log."; } > "$body"
          if [ "$status" = "PASS" ]; then
            if [ -n "$open" ]; then gh issue comment "$open" --body "Passing again: $RUN_URL" && gh issue close "$open"; fi
          elif [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$body"
          else
            gh issue create --label api-contract --title "API wording check: $status" --body-file "$body"
          fi
      - name: Fail the run when a check failed
        if: steps.check.outcome == 'failure'
        run: exit 1
